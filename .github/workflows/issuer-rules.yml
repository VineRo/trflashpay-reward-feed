name: Verify issuer announcements and publish rules
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Daily at 09:17 Asia/Taipei; GitHub schedules can be delayed.
    - cron: '17 1 * * *'
permissions:
  contents: read
concurrency:
  group: issuer-rules
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Record the preinstalled Chrome used to render dynamic official pages
        run: google-chrome --version
      - name: Verify current official evidence and approved rules
        run: python pipeline.py --publish
      - name: Save evidence even when bank pages change
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issuer-evidence-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified feed
        id: deployment
        uses: actions/deploy-pages@v4
